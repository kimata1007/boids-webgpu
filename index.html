<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Boids WebGPU</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="gpu"></canvas>
    <div id="hud">
      <div><span class="k">fps</span> <span id="fps">--</span></div>
      <div><span class="k">boids</span> <span id="count">--</span></div>
      <div class="hint">left drag: attract &nbsp; right drag: scatter</div>
    </div>
    <div id="wing-control">
      <button id="pause" type="button">⏸ Pause</button>
    </div>
    <div id="credit">
      Bird model: <a href="https://sketchfab.com/3d-models/flying-bird-eb843194e06d429ebef7dd4aa7e265c1" target="_blank" rel="noopener">"Flying Bird"</a> by sandeep.s,
      licensed <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC-BY 4.0</a>.
    </div>
    <div id="msg"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
